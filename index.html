<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRIG · Smart Irrigation</title>
    <!-- Dependencias -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="header-slim">
    <div class="nav-container">
        <div class="brand">
            <img src="img/logo-srig.png" class="logo-mini">
            <span>SRIG</span>
        </div>
        <nav class="nav-links">
            <a href="#inicio" data-i18n="nav_inicio"></a>
            <a href="#sistema" data-i18n="nav_funcionamiento"></a>
            <a href="#arquitectura" data-i18n="nav_arquitectura"></a>
            <a href="#contacto" data-i18n="nav_contacto"></a>
        </nav>
        <div class="controls">
            <button id="langToggle">EN</button>
            <button id="themeToggle">🌙</button>
        </div>
    </div>
</header>

<main class="main-content">
    <!-- INICIO -->
    <section id="inicio" class="page active">
        <h2 class="gradient-text" data-i18n="title_intro"></h2>
        <p class="lead" data-i18n="intro_p1"></p>
        
        <div class="justification-grid">
            <div class="card chart-card">
                <canvas id="savingsChart"></canvas>
            </div>
            <div class="card info-card">
                <h3 data-i18n="title_purpose"></h3>
                <ul>
                    <li data-i18n="purpose_list_1"></li>
                    <li data-i18n="purpose_list_2"></li>
                    <li data-i18n="purpose_list_3"></li>
                    <li data-i18n="purpose_list_4"></li>
                </ul>
            </div>
        </div>
    </section>

    <!-- SISTEMA -->
    <section id="sistema" class="page">
        <h2 data-i18n="title_operation"></h2>
        <div class="features">
            <div class="card-sm"><h4 data-i18n="op_control"></h4><p data-i18n="op_control_desc"></p></div>
            <div class="card-sm"><h4 data-i18n="op_safety"></h4><p data-i18n="op_safety_desc"></p></div>
        </div>
        <div class="diagram-section">
            <h3 data-i18n="title_flow"></h3>
            <img src="img/flujo-operacion.png" class="diag-fixed">
            <div class="card variables">
                <h4 data-i18n="proc_vars_title"></h4>
                <p data-i18n="proc_vars_in"></p>
                <p data-i18n="proc_vars_ctrl"></p>
            </div>
        </div>
    </section>

    <!-- ARQUITECTURA -->
    <section id="arquitectura" class="page">
        <h2 data-i18n="title_architecture"></h2>
        <div class="arch-grid">
            <img src="img/arquitectura.png" class="diag-fixed">
            <div class="card">
                <h4 data-i18n="arch_ctrl"></h4>
                <p data-i18n="arch_ctrl_desc"></p>
                <img src="img/instalacion-real.jpg" class="diag-fixed">
            </div>
        </div>
    </section>

    <!-- CONTACTO -->
    <section id="contacto" class="page">
        <h2 data-i18n="title_contact"></h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th data-i18n="table_col_project"></th>
                        <th data-i18n="table_col_resp"></th>
                        <th data-i18n="table_col_mail"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>Dirección Ecológica</td><td>Guadalupe Alvarado</td><td>guadalupe_alvarado@utcj.edu.mx</td></tr>
                    <tr><td>Desarrollo SRIG</td><td>David Ortega</td><td>al24320557@utcj.edu.mx</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer class="footer-slim">
    <p data-i18n="footer_text"></p>
</footer>

<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
