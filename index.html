<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">SRIG · RATIOMA Systemica</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="navbar">
    <div class="nav-container">
        <div class="brand">
            <img src="img/logo-srig.png" class="logo" alt="Logo">
            <div class="brand-text">
                <span class="company">RATIOMA Systemica</span>
                <span class="project">SRIG · v2.0</span>
            </div>
        </div>
        <nav class="nav-links">
            <a href="#inicio" data-i18n="nav_inicio"></a>
            <a href="#estrategia" data-i18n="nav_estrategia"></a>
            <a href="#ingenieria" data-i18n="nav_arquitectura"></a>
            <a href="#gestion" data-i18n="nav_gestion"></a>
            <a href="#mercado" data-i18n="nav_mercado"></a>
            <a href="#contacto" data-i18n="nav_contacto"></a>
        </nav>
        <div class="actions">
            <button id="langToggle" class="btn-sm">EN</button>
            <button id="themeToggle" class="btn-sm">🌙</button>
        </div>
    </div>
</header>

<main class="content">
    <!-- SECCIÓN INICIO -->
    <section id="inicio" class="page active">
        <div class="hero">
            <h1 class="gradient-text" data-i18n="hero_title"></h1>
            <p class="lead" data-i18n="hero_sub"></p>
            <div class="badges">
                <span>PMBOK</span><span>APQP</span><span>LEAN MFG</span>
            </div>
        </div>
        <div class="grid-2">
            <div class="card">
                <h3 data-i18n="intro_title"></h3>
                <p data-i18n="intro_p1"></p>
            </div>
            <div class="card">
                <h3 data-i18n="obj_title"></h3>
                <ul id="obj_list"></ul>
            </div>
        </div>
    </section>

    <!-- SECCIÓN ESTRATEGIA (FODA/PESTEL) -->
    <section id="estrategia" class="page">
        <h2 class="section-title" data-i18n="nav_estrategia"></h2>
        <div class="swot-grid">
            <div class="swot-item f"><h4 data-i18n="f_t"></h4><p data-i18n="f_d"></p></div>
            <div class="swot-item o"><h4 data-i18n="o_t"></h4><p data-i18n="o_d"></p></div>
            <div class="swot-item d"><h4 data-i18n="d_t"></h4><p data-i18n="d_d"></p></div>
            <div class="swot-item a"><h4 data-i18n="a_t"></h4><p data-i18n="a_d"></p></div>
        </div>
        <div class="card pestel">
            <h3 data-i18n="pestel_title"></h3>
            <div class="pestel-grid" id="pestel_container"></div>
        </div>
    </section>

    <!-- SECCIÓN INGENIERÍA (Diagrama de Arquitectura Real) -->
    <section id="ingenieria" class="page">
        <h2 class="section-title" data-i18n="nav_arquitectura"></h2>
        <div class="arch-diagram">
            <div class="diag-group">
                <h5 data-i18n="diag_interface"></h5>
                <div class="boxes"><div class="b" data-i18n="diag_phys"></div><div class="b" data-i18n="diag_web"></div></div>
            </div>
            <div class="connector-v"></div>
            <div class="diag-row-split">
                <div class="diag-group main"><h5 data-i18n="diag_core"></h5><p data-i18n="diag_core_d"></p></div>
                <div class="connector-h"></div>
                <div class="diag-group"><h5 data-i18n="diag_sensors"></h5><div class="b" data-i18n="diag_flow"></div></div>
            </div>
            <div class="connector-v"></div>
            <div class="diag-group">
                <h5 data-i18n="diag_actuators"></h5>
                <div class="boxes"><div class="b" data-i18n="diag_v1"></div><div class="b" data-i18n="diag_v2"></div></div>
            </div>
        </div>
        <div class="img-strip">
            <img src="img/instalacion-real.jpg" alt="Instalación">
            <img src="img/arquitectura.png" alt="Hardware">
        </div>
    </section>

    <!-- SECCIÓN GESTIÓN (Flujo y Riesgos) -->
    <section id="gestion" class="page">
        <h2 class="section-title" data-i18n="nav_gestion"></h2>
        <div class="flow-diagram-real" id="flow_steps"></div>
        <div class="card table-card">
            <h3 data-i18n="risk_title"></h3>
            <table class="data-table">
                <thead><tr><th data-i18n="th_r"></th><th data-i18n="th_i"></th><th data-i18n="th_m"></th></tr></thead>
                <tbody id="risk_body"></tbody>
            </table>
        </div>
    </section>

    <!-- SECCIÓN MERCADO -->
    <section id="mercado" class="page">
        <h2 class="section-title" data-i18n="nav_mercado"></h2>
        <div class="grid-2">
            <div class="card chart-box"><canvas id="savingsChart"></canvas></div>
            <div class="card chart-box"><canvas id="marketChart"></canvas></div>
        </div>
        <div class="card references">
            <h3 data-i18n="ref_title"></h3>
            <div id="biblio_list"></div>
        </div>
    </section>

    <!-- SECCIÓN CONTACTO -->
    <section id="contacto" class="page">
        <h2 class="section-title" data-i18n="nav_contacto"></h2>
        <div class="card">
            <table class="data-table">
                <thead><tr><th data-i18n="th_name"></th><th data-i18n="th_role"></th><th>Email</th></tr></thead>
                <tbody id="team_body"></tbody>
            </table>
        </div>
    </section>
</main>

<footer class="footer">
    <p data-i18n="footer_text"></p>
</footer>

<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
