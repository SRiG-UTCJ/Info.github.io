<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title">SRIG · RATIOMA Systemica</title>
    
    <!-- Librerías de Terceros -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Enlace a estilos -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="light-theme">

<header class="navbar">
    <div class="nav-container">
        <!-- Logo y Marca -->
        <div class="brand">
            <img src="img/logo-srig.png" class="logo-img" alt="SRIG Logo">
            <div class="brand-info">
                <span class="corp-name">RATIOMA Systemica</span>
                <span class="proj-tag">Project SRIG v2.0</span>
            </div>
        </div>

        <!-- Menú Hamburguesa para Móvil -->
        <button class="hamburger" id="hamburger" aria-label="Menu">
            <i data-lucide="menu"></i>
        </button>

        <!-- Navegación por Pestañas (SPA) -->
        <nav class="main-nav" id="mainNav">
            <a href="#inicio" data-i18n="nav_inicio" class="active"></a>
            <a href="#negocio" data-i18n="nav_negocio"></a>
            <a href="#estrategia" data-i18n="nav_estrategia"></a>
            <a href="#ingenieria" data-i18n="nav_arquitectura"></a>
            <a href="#proceso" data-i18n="nav_proceso"></a>
            <a href="#gestion" data-i18n="nav_gestion"></a>
            <a href="#legal" data-i18n="nav_legal"></a>
            <a href="#contacto" data-i18n="nav_contacto"></a>
        </nav>

        <!-- Botones de Control -->
        <div class="header-actions">
            <button id="langToggle" class="btn-util">EN</button>
            <button id="themeToggle" class="btn-util">🌙</button>
        </div>
    </div>
</header>

<!-- Contenido Principal Dinámico -->
<main class="main-content">

    <!-- PESTAÑA: INICIO -->
    <section id="inicio" class="page active">
        <div class="hero">
            <h1 class="gradient-text" data-i18n="hero_title"></h1>
            <p class="hero-sub" data-i18n="hero_sub"></p>
            <div class="methodology-badges">
                <span class="badge">PMBOK Guide</span>
                <span class="badge">Lean Manufacturing</span>
                <span class="badge">APQP Standard</span>
            </div>
        </div>
        
        <div class="card shadow-sm">
            <h3 class="card-title" data-i18n="intro_title"></h3>
            <p data-i18n="intro_p1"></p>
        </div>

        <div class="card collapsible">
            <div class="card-header">
                <h3 data-i18n="obj_title"></h3>
                <i data-lucide="chevron-down"></i>
            </div>
            <div class="card-body">
                <ul class="check-list" id="objectiveList"></ul>
            </div>
        </div>
    </section>

    <!-- PESTAÑA: MODELO DE NEGOCIO -->
    <section id="negocio" class="page">
        <h2 class="section-header" data-i18n="nav_negocio"></h2>
        <div class="grid-layout">
            <div class="card info-card">
                <h3 data-i18n="biz_comp_name"></h3>
                <p data-i18n="biz_mission"></p>
                <div class="savings-kpi">
                    <div class="kpi-box">
                        <h4 data-i18n="kpi_water_val"></h4>
                        <span data-i18n="kpi_water_txt"></span>
                    </div>
                </div>
            </div>
            <div class="card chart-card">
                <canvas id="impactChart"></canvas>
            </div>
        </div>
    </section>

    <!-- PESTAÑA: ESTRATEGIA -->
    <section id="estrategia" class="page">
        <h2 class="section-header" data-i18n="str_title"></h2>
        
        <!-- FODA Colapsable -->
        <div class="card collapsible active">
                    <h3 class="sub-header" data-i18n="foda_title"></h3>
        <div class="swot-grid-v3">
            <div class="swot-card f">
                <div class="swot-icon"><i data-lucide="shield-check"></i></div>
                <h4 data-i18n="foda_f"></h4>
                <p data-i18n="foda_f_txt"></p>
            </div>
            <div class="swot-card o">
                <div class="swot-icon"><i data-lucide="trending-up"></i></div>
                <h4 data-i18n="foda_o"></h4>
                <p data-i18n="foda_o_txt"></p>
            </div>
            <div class="swot-card d">
                <div class="swot-icon"><i data-lucide="alert-circle"></i></div>
                <h4 data-i18n="foda_d"></h4>
                <p data-i18n="foda_d_txt"></p>
            </div>
            <div class="swot-card a">
                <div class="swot-icon"><i data-lucide="zap-off"></i></div>
                <h4 data-i18n="foda_a"></h4>
                <p data-i18n="foda_a_txt"></p>
            </div>
        </div>
        </div>

        <div class="card">
            <h3 class="card-title" data-i18n="pestel_title"></h3>
            <div class="pestel-container" id="pestelGrid"></div>
        </div>
    </section>

    <!-- PESTAÑA: INGENIERÍA -->
    <section id="ingenieria" class="page">
        <h2 class="section-header" data-i18n="eng_title"></h2>
        
        <!-- Diagrama de Arquitectura (CSS) -->
        <div class="card diag-card">
            <h3 class="sub-header" data-i18n="diag_arch_title"></h3>
            <div class="logic-diag">
                <div class="diag-node glass"><i data-lucide="monitor"></i><span data-i18n="diag_node_ui"></span></div>
                <div class="diag-arrow-v"></div>
                <div class="diag-node main-cpu"><i data-lucide="cpu"></i><span data-i18n="diag_node_core"></span></div>
                <div class="diag-branch">
                    <div class="diag-node"><i data-lucide="settings-2"></i><span data-i18n="diag_node_act"></span></div>
                    <div class="diag-node"><i data-lucide="gauge"></i><span data-i18n="diag_node_sens"></span></div>
                </div>
            </div>
        </div>

        <div class="card">
            <h3 data-i18n="specs_title"></h3>
            <div id="specsTable" class="table-responsive"></div>
            <div class="tech-gallery-v3">
                <div class="img-item">
                    <img src="img/instalacion-real.jpg" alt="Instalación">
                    <small data-i18n="img_cap_1"></small>
                </div>
                <div class="img-item">
                    <img src="img/arquitectura.png" alt="Hardware">
                    <small data-i18n="img_cap_2"></small>
                </div>
            </div>
        </div>
    </section>

    <!-- PESTAÑA: PROCESO -->
    <section id="proceso" class="page">
        <h2 class="section-header" data-i18n="proc_title"></h2>
       <div class="process-explainer-v3">
            <div class="proc-text">
                <p data-i18n="proc_p1"></p>
                <div class="proc-steps-list">
                    <div class="p-step"><strong>1. Sensado:</strong> <span data-i18n="tflow_1"></span></div>
                    <div class="p-step"><strong>2. Lógica:</strong> <span data-i18n="tflow_2"></span></div>
                    <div class="p-step"><strong>3. Acción:</strong> <span data-i18n="tflow_3"></span></div>
                    <div class="p-step"><strong>4. Feedback:</strong> <span data-i18n="tflow_4"></span></div>
                    <div class="p-step"><strong>5. Control:</strong> <span data-i18n="tflow_5"></span></div>
                </div>
            </div>
            <div class="flow-chart-container" id="flowSteps"></div>
        </div>
        <div class="card warning-alert">
            <i data-lucide="alert-triangle"></i>
            <p data-i18n="proc_safety_note"></p>
        </div>
    </section>

    <!-- PESTAÑA: GESTIÓN -->
    <section id="gestion" class="page">
        <h2 class="section-header" data-i18n="mgmt_title"></h2>
        <div class="card">
            <h3 data-i18n="edt_title"></h3>
            <div class="edt-timeline" id="edtTimeline"></div>
        </div>
        
        <!-- Riesgos Colapsable -->
        <div class="card collapsible">
            <div class="card-header">
                <h3 data-i18n="risk_title"></h3>
                <i data-lucide="chevron-down"></i>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="tech-table">
                        <thead>
                            <tr>
                                <th data-i18n="th_risk"></th>
                                <th data-i18n="th_impact"></th>
                                <th data-i18n="th_mitigation"></th>
                            </tr>
                        </thead>
                        <tbody id="riskTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <!-- PESTAÑA: AVISO LEGAL -->
    <section id="legal" class="page">
        <h2 class="section-header" data-i18n="nav_legal"></h2>
        <div class="card legal-card">
            <h3 data-i18n="legal_title"></h3>
            <p data-i18n="legal_p"></p>
            <br>
            <p data-i18n="legal_extra"></p>
        </div>
    </section>
<!-- PESTAÑA: CONTACTO -->
<section id="contacto" class="page">
    <h2 class="section-header" data-i18n="nav_contacto"></h2>
    <div class="card shadow-sm">
        <h3 data-i18n="cont_title"></h3>
        <div class="table-responsive">
            <table class="tech-table">
                <thead>
                    <tr>
                        <th data-i18n="th_name"></th>
                        <th data-i18n="th_role"></th>
                    </tr>
                </thead>
                <tbody id="teamTableBody">
                    <!-- JS inyectará el equipo aquí -->
                </tbody>
            </table>
        </div>
    </div>
</section>
</main>

<!-- Footer Corporativo: Logo a la izquierda -->
<footer class="main-footer">
    <div class="footer-container">
        <div class="footer-brand-group">
            <img src="img/logo-srig.png" alt="UTCJ Logo" class="footer-logo">
            <div class="footer-text">
                <p data-i18n="footer_text"></p>
                <small data-i18n="footer_location"></small>
            </div>
        </div>
    </div>
</footer>

<!-- Scripts de control -->
<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
</body>
</html>
